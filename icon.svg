<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Black canvas -->
  <rect width="64" height="64" fill="#111111"/>

  <!-- Red circle: dominant, left-of-center -->
  <circle cx="22" cy="32" r="22" fill="#e63329"/>

  <!-- Yellow square: top-right, overlapping the circle -->
  <rect x="32" y="4" width="28" height="28" fill="#f5d600"/>

  <!-- Blue triangle: bottom-right, apex pointing up -->
  <polygon points="32,60 50,32 60,60" fill="#1c4ed8"/>
</svg>
